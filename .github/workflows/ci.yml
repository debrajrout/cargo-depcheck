name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  msrv:
    name: msrv (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  lockfile:
    name: lockfile is a fixpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A committed Cargo.lock that a bare `cargo metadata` immediately
      # rewrites means the resolved dependency set isn't actually pinned —
      # `--locked` elsewhere in this workflow can't catch that on its own.
      - run: cargo metadata --format-version 1 > /dev/null
      - run: git diff --exit-code Cargo.lock

  dogfood-action:
    name: dogfood the published Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Real end-to-end proof the published Action installs and runs
      # against a real project, not just a review of action.yml.
      # fail-on: none so a real finding here never blocks unrelated PRs —
      # this job exists to catch the Action itself breaking, not to gate
      # on this repo's own dependency health.
      - uses: debrajrout/cargo-depcheck@v1
        with:
          fail-on: none
