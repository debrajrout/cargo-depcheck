name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  msrv:
    name: msrv (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  lockfile:
    name: lockfile is a fixpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A committed Cargo.lock that a bare `cargo metadata` immediately
      # rewrites means the resolved dependency set isn't actually pinned —
      # `--locked` elsewhere in this workflow can't catch that on its own.
      - run: cargo metadata --format-version 1 > /dev/null
      - run: git diff --exit-code Cargo.lock

  # Two jobs, because the action has two failure modes that need different
  # binaries to catch.
  #
  # This one runs `./` — the action.yml in this checkout — exactly as a user
  # would, against the binary it downloads from the latest release. It is what
  # catches a broken install step, a bad archive name, or a shell error in the
  # gating run. It deliberately passes no input that needs an unreleased
  # binary: the download can only ever fetch the *previous* release, so those
  # belong in the job below.
  dogfood-action:
    name: dogfood the published Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # fail-on: none so a real dependency finding never blocks an unrelated
      # PR; this job exists to catch the action breaking, not to gate on this
      # repo's own dependency health.
      #
      # summary: false keeps this job on flags every released binary
      # understands. With it on, the Markdown step would ask the previous
      # release for `--format markdown`, which it may not have, and emit a
      # warning on every run until the next release catches up.
      - uses: ./
        id: depcheck
        with:
          fail-on: none
          summary: false
      - name: the action reported real counts
        env:
          CRITICAL: ${{ steps.depcheck.outputs.critical }}
          REPORT_PATH: ${{ steps.depcheck.outputs.report-path }}
        run: |
          set -euo pipefail
          # "unknown" is what the output extractor falls back to when the JSON
          # report is missing or unreadable, so it is the signal that the
          # action ran but produced nothing usable.
          if [ -z "${CRITICAL:-}" ] || [ "$CRITICAL" = "unknown" ]; then
            echo "::error::the action produced no usable summary counts"
            exit 1
          fi
          test -s "$REPORT_PATH" || { echo "::error::no JSON report at $REPORT_PATH"; exit 1; }

  # This one builds the binary from the checkout and hands it to the action via
  # `version: local`, so inputs that depend on unreleased behavior (top,
  # baseline, the Markdown and comment paths) are exercised before they ship
  # rather than after.
  dogfood-action-unreleased:
    name: dogfood the Action against this checkout
    runs-on: ubuntu-latest
    # Lets the comment path actually post on same-repo pull requests. A fork's
    # token has no write access regardless, which is the case the action
    # already downgrades to a warning rather than a failure.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build this checkout's binary and put it on PATH
        run: |
          set -euo pipefail
          cargo build --locked
          mkdir -p "$RUNNER_TEMP/local-bin"
          cp target/debug/cargo-depcheck "$RUNNER_TEMP/local-bin/"
          echo "$RUNNER_TEMP/local-bin" >> "$GITHUB_PATH"

      - uses: ./
        id: depcheck
        with:
          version: local
          fail-on: none
          top: 10
          comment: true

      # The Markdown and comment steps are `continue-on-error` inside the
      # action — a comment must never fail someone's build — which means a
      # broken shell block there would otherwise surface as a warning nobody
      # reads. Asserting on the outputs here is what makes that code tested.
      - name: the action produced a usable Markdown report
        env:
          MARKDOWN_PATH: ${{ steps.depcheck.outputs.markdown-path }}
        run: |
          set -euo pipefail
          if [ -z "${MARKDOWN_PATH:-}" ]; then
            echo "::error::the action produced no markdown-path output"
            exit 1
          fi
          if [ ! -s "$MARKDOWN_PATH" ]; then
            echo "::error::the Markdown report at $MARKDOWN_PATH is empty"
            exit 1
          fi
          if ! head -1 "$MARKDOWN_PATH" | grep -qF '<!-- cargo-depcheck -->'; then
            echo "::error::the Markdown report is missing its sticky-comment marker"
            exit 1
          fi
          echo "Markdown report looks well-formed:"
          head -5 "$MARKDOWN_PATH"

      # A baseline written and then immediately compared against must report
      # nothing new. This is the property the whole feature rests on, and it
      # is cheap to assert against a real graph rather than only a fixture.
      - name: a baseline round-trip reports no new findings
        run: |
          set -euo pipefail
          cargo-depcheck depcheck --write-baseline "$RUNNER_TEMP/baseline.json" --quiet
          cargo-depcheck depcheck --baseline "$RUNNER_TEMP/baseline.json" \
            --fail-on warn --quiet
