name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Created as a DRAFT and published only once every archive has been
      # attached (see `finalize-release`). A published release with no assets
      # is immediately visible to `/releases/latest`, which is what the
      # action's `version: latest` resolves against — so publishing up front
      # meant every consumer who ran during the build window resolved to the
      # new tag and then 404'd on the download. Drafts are excluded from that
      # endpoint, which also means a partially-failed matrix never becomes
      # the "latest" release.
      - run: gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Shell completions and the man page are plain text generated by the tool
  # itself (`depcheck completions <shell>` / `depcheck mangen`) — identical
  # regardless of target architecture. Built once, natively, on the runner
  # that's actually creating the release, and handed to every matrix leg
  # below rather than rebuilt (and, for the cross-compiled targets,
  # unable to even *run*) five times over.
  generate-docs:
    name: generate completions and man page
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: |
          mkdir -p dist/completions
          for shell in bash elvish fish powershell zsh; do
            ./target/release/cargo-depcheck depcheck completions "$shell" > "dist/completions/cargo-depcheck.$shell"
          done
          ./target/release/cargo-depcheck depcheck mangen > dist/cargo-depcheck.1
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: dist/

  build:
    name: build (${{ matrix.target }})
    needs: [create-release, generate-docs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ordered by real-world demand: independent asset-download data from
        # cargo-machete and cargo-deny both show ~86-90% of installs are
        # x86_64-unknown-linux-musl, with aarch64-linux, Windows, and
        # aarch64-macOS each in the low single digits, and x86_64-macOS under
        # 0.5%. musl (not gnu) is what's actually downloaded on Linux — likely
        # because musl binaries run unmodified on Alpine/scratch containers
        # and don't depend on the host's glibc version.
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: dist/
      # musl and cross-arch-linux targets are cross-compiled automatically
      # via `cross` (this action installs it if missing); Windows and macOS
      # targets build natively on their own runner.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: cargo-depcheck
          target: ${{ matrix.target }}
          archive: cargo-depcheck-$tag-$target
          checksum: sha256
          include: dist/cargo-depcheck.1,dist/completions/cargo-depcheck.bash,dist/completions/cargo-depcheck.elvish,dist/completions/cargo-depcheck.fish,dist/completions/cargo-depcheck.powershell,dist/completions/cargo-depcheck.zsh
          token: ${{ secrets.GITHUB_TOKEN }}

  # Only now is every archive attached, so the release is safe to publish.
  # Until this runs, `/releases/latest` still points at the previous release
  # and existing users keep getting a version whose assets actually exist.
  finalize-release:
    name: publish the draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: publish to crates.io
    needs: finalize-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
