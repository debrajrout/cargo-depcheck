[package]
name = "cargo-depcheck"
version = "0.3.1"
edition = "2021"
rust-version = "1.91"
description = "Ranked dependency health report — security advisories, version lag, and maintenance signals weighted by graph depth"
license = "MIT OR Apache-2.0"
repository = "https://github.com/debrajrout/cargo-depcheck"
homepage = "https://github.com/debrajrout/cargo-depcheck"
documentation = "https://github.com/debrajrout/cargo-depcheck#readme"
readme = "README.md"
keywords = ["cargo", "dependencies", "security", "audit", "maintenance"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
exclude = [
    ".github/",
    "tests/fixtures/",
    "tests/schemas/",
    "IMPLEMENTATION_PLAN.md",
]

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Registry index access (sparse index, no crates.io rate limit) — bring our
# own TLS-capable client, since tame-index takes no stance on TLS.
tame-index = { version = "0.26.1", features = ["local", "sparse"] }
reqwest = { version = "0.13", features = ["rustls", "gzip"], default-features = false }

# Serialization / deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cargo project graph parsing
cargo_metadata = "0.23"

# RustSec advisory database
rustsec = "0.33"

# Semantic version parsing and comparison
semver = "1"

# Date and time (for days-since-last-publish)
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"

# Terminal colors
colored = "3"
unicode-width = "0.2"
terminal_size = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
assert_cmd = "2"
insta = "1"
jsonschema = "0.52.0"
predicates = "3"
