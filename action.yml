name: 'cargo-depcheck'
description: 'Ranked dependency health: security advisories, version lag, and maintenance signals weighted by graph depth'
author: 'debrajrout'
branding:
  icon: 'shield'
  color: 'orange'

inputs:
  version:
    description: 'cargo-depcheck release tag to install (e.g. v0.2.0). Defaults to the latest release.'
    required: false
    default: 'latest'
  token:
    description: >-
      Token used to look up the latest release and download the archive.
      Defaults to the job token. Only needed to avoid the unauthenticated
      GitHub API rate limit (60/hr per runner IP), which busy CI can hit.
    required: false
    default: ${{ github.token }}
  manifest-path:
    description: 'Path to Cargo.toml (defaults to the nearest one from the working directory)'
    required: false
    default: ''
  threshold:
    description: 'Only display dependencies scoring at or above this value; does not weaken fail-on (tool default: 40)'
    required: false
    default: ''
  fail-on:
    description: 'Fail the job when a finding at or above this level is present: none, warn, or critical'
    required: false
    default: 'critical'
  ignore:
    description: 'Space-separated crate names to skip'
    required: false
    default: ''
  allow-incomplete:
    description: 'Do not fail the job when crates.io metadata could not be fetched for some dependencies'
    required: false
    default: 'false'
  summary:
    description: 'Write a Markdown summary table to the job summary'
    required: false
    default: 'true'
  sarif:
    description: >-
      Also upload findings to the GitHub Security tab as SARIF. Requires
      `security-events: write` permission on the calling workflow/job.
    required: false
    default: 'false'
  sarif-category:
    description: 'SARIF upload category, useful when running this action more than once in the same workflow'
    required: false
    default: ''
  comment:
    description: >-
      On a pull request, post the report as a comment and update that same
      comment on later pushes instead of adding a new one. Requires
      `pull-requests: write` permission on the calling workflow/job. Ignored
      outside pull-request events.
    required: false
    default: 'false'
  comment-key:
    description: >-
      Distinguishes the comment this run owns, for workflows that call this
      action more than once (a matrix, or several manifests). Each key gets
      its own comment; runs sharing a key update the same one.
    required: false
    default: 'default'
  top:
    description: 'Report only the N highest-scoring dependencies (display only; never weakens fail-on)'
    required: false
    default: ''
  baseline:
    description: >-
      Path to a baseline report (see `--write-baseline`). With one set,
      `fail-on` considers only findings that are new since the baseline, so an
      inherited backlog does not fail every build.
    required: false
    default: ''

outputs:
  critical:
    description: 'Number of CRITICAL findings'
    value: ${{ steps.run.outputs.critical }}
  warnings:
    description: 'Number of WARN findings'
    value: ${{ steps.run.outputs.warnings }}
  notices:
    description: 'Number of NOTICE findings below the warning level'
    value: ${{ steps.run.outputs.notices }}
  unknown:
    description: 'Number of registry dependencies with unavailable metadata and no higher-severity finding'
    value: ${{ steps.run.outputs.unknown }}
  not_applicable:
    description: 'Number of path or git dependencies without registry health metadata'
    value: ${{ steps.run.outputs.not_applicable }}
  ignored:
    description: 'Number of dependencies suppressed by policy'
    value: ${{ steps.run.outputs.ignored }}
  healthy:
    description: 'Number of checked dependencies with score zero'
    value: ${{ steps.run.outputs.healthy }}
  report-path:
    description: 'Path to the full JSON report on disk'
    value: ${{ steps.run.outputs.report-path }}
  markdown-path:
    description: 'Path to the Markdown report on disk, when comment or summary output was produced'
    value: ${{ steps.markdown.outputs.markdown-path }}
  comment-url:
    description: 'URL of the pull-request comment this run created or updated, if any'
    value: ${{ steps.comment.outputs.comment-url }}

runs:
  using: 'composite'
  steps:
    - name: Install cargo-depcheck
      shell: bash
      env:
        CARGO_DEPCHECK_VERSION: ${{ inputs.version }}
        CARGO_DEPCHECK_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        # Authenticated when a token is available: the unauthenticated API
        # allows 60 requests/hr per runner IP, and on a busy shared runner
        # that 403 surfaced only as a bare `curl` exit 22 with no explanation.
        auth=()
        if [ -n "${CARGO_DEPCHECK_TOKEN:-}" ]; then
          auth=(-H "Authorization: Bearer $CARGO_DEPCHECK_TOKEN")
        fi

        version="$CARGO_DEPCHECK_VERSION"
        if [ "$version" = "latest" ]; then
          if ! release=$(curl -fsSL "${auth[@]}" https://api.github.com/repos/debrajrout/cargo-depcheck/releases/latest); then
            echo "::error::Could not resolve the latest cargo-depcheck release. Pin an explicit 'version:' or retry."
            exit 1
          fi
          version=$(jq -r .tag_name <<<"$release")
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::The latest-release lookup returned no tag name."
            exit 1
          fi
        fi

        os="$(uname -s)"
        arch="$(uname -m)"
        ext="tar.gz"
        bin_name="cargo-depcheck"
        case "$os-$arch" in
          Linux-x86_64)   target="x86_64-unknown-linux-musl" ;;
          Linux-aarch64)  target="aarch64-unknown-linux-musl" ;;
          Darwin-x86_64)  target="x86_64-apple-darwin" ;;
          Darwin-arm64)   target="aarch64-apple-darwin" ;;
          MINGW*|MSYS*|CYGWIN*)
            target="x86_64-pc-windows-msvc"
            ext="zip"
            bin_name="cargo-depcheck.exe"
            ;;
          *)
            echo "::error::Unsupported platform: $os-$arch"
            exit 1
            ;;
        esac

        url="https://github.com/debrajrout/cargo-depcheck/releases/download/${version}/cargo-depcheck-${version}-${target}.${ext}"
        install_dir="$RUNNER_TEMP/cargo-depcheck-bin"
        mkdir -p "$install_dir"
        archive="$RUNNER_TEMP/cargo-depcheck.$ext"

        echo "Downloading $url"
        curl -fsSL "$url" -o "$archive"

        if [ "$ext" = "zip" ]; then
          unzip -q "$archive" -d "$install_dir"
        else
          tar -xzf "$archive" -C "$install_dir"
        fi
        chmod +x "$install_dir/$bin_name" 2>/dev/null || true

        echo "$install_dir" >> "$GITHUB_PATH"

    # Runs (and, if it finds nothing to upload, is skipped) before the gating
    # run below, so a SARIF upload always happens even when --fail-on later
    # fails the job — that's the point of surfacing findings in the Security
    # tab, not something that should be skipped because the job also failed.
    - name: Generate SARIF report
      if: inputs.sarif == 'true'
      id: sarif
      shell: bash
      continue-on-error: true
      env:
        INPUT_MANIFEST_PATH: ${{ inputs.manifest-path }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_IGNORE: ${{ inputs.ignore }}
      run: |
        set -uo pipefail
        args=(depcheck --format sarif --fail-on none)
        [ -n "$INPUT_MANIFEST_PATH" ] && args+=(--manifest-path "$INPUT_MANIFEST_PATH")
        [ -n "$INPUT_THRESHOLD" ] && args+=(--threshold "$INPUT_THRESHOLD")
        for crate in $INPUT_IGNORE; do
          args+=(--ignore "$crate")
        done

        sarif_path="$RUNNER_TEMP/cargo-depcheck.sarif"
        code=0
        cargo-depcheck "${args[@]}" >"$sarif_path" 2>"$RUNNER_TEMP/cargo-depcheck-sarif-stderr.log" || code=$?
        cat "$RUNNER_TEMP/cargo-depcheck-sarif-stderr.log" >&2

        # Publish the path only if a usable report actually landed. This step
        # is continue-on-error, but the upload step below is not — so setting
        # the output unconditionally meant a failed run (bad manifest-path,
        # say) left a 0-byte file that upload-sarif rejected, failing the
        # whole job even under `fail-on: none`.
        #
        # Exit 3 is deliberately accepted: a degraded run still writes valid
        # SARIF before exiting, and those findings are worth uploading.
        if { [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; } && [ -s "$sarif_path" ]; then
          echo "sarif-path=$sarif_path" >>"$GITHUB_OUTPUT"
        else
          echo "::warning::cargo-depcheck could not produce a SARIF report (exit $code); skipping the Security tab upload"
        fi

    - name: Upload SARIF to the Security tab
      if: inputs.sarif == 'true' && steps.sarif.outputs.sarif-path != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.sarif.outputs.sarif-path }}
        category: ${{ inputs.sarif-category }}

    # Like the SARIF step, this runs before the gating run below: a job that
    # is about to fail is exactly when the report needs to reach the reviewer,
    # so producing and posting it must not depend on the gate passing. The
    # registry and advisory caches are warm from the SARIF step or populated
    # here, so this is a cheap second pass rather than a second full fetch.
    - name: Generate the Markdown report
      if: inputs.comment == 'true' || inputs.summary == 'true'
      id: markdown
      shell: bash
      continue-on-error: true
      env:
        INPUT_MANIFEST_PATH: ${{ inputs.manifest-path }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_TOP: ${{ inputs.top }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete }}
      run: |
        set -uo pipefail
        args=(depcheck --format markdown --fail-on none)
        [ -n "$INPUT_MANIFEST_PATH" ] && args+=(--manifest-path "$INPUT_MANIFEST_PATH")
        [ -n "$INPUT_THRESHOLD" ] && args+=(--threshold "$INPUT_THRESHOLD")
        [ -n "$INPUT_TOP" ] && args+=(--top "$INPUT_TOP")
        [ -n "$INPUT_BASELINE" ] && args+=(--baseline "$INPUT_BASELINE")
        [ "$INPUT_ALLOW_INCOMPLETE" = "true" ] && args+=(--allow-incomplete)
        for crate in $INPUT_IGNORE; do
          args+=(--ignore "$crate")
        done

        markdown_path="$RUNNER_TEMP/cargo-depcheck.md"
        code=0
        cargo-depcheck "${args[@]}" >"$markdown_path" 2>"$RUNNER_TEMP/cargo-depcheck-md-stderr.log" || code=$?
        cat "$RUNNER_TEMP/cargo-depcheck-md-stderr.log" >&2

        # Exit 3 (incomplete data) still writes a usable report, and saying so
        # in the comment is more useful than posting nothing.
        if { [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; } && [ -s "$markdown_path" ]; then
          echo "markdown-path=$markdown_path" >>"$GITHUB_OUTPUT"
        else
          echo "::warning::cargo-depcheck could not produce a Markdown report (exit $code)"
        fi

    - name: Comment the report on the pull request
      if: >-
        inputs.comment == 'true'
        && github.event.pull_request.number
        && steps.markdown.outputs.markdown-path != ''
      id: comment
      shell: bash
      # A comment is a courtesy, never a gate: a missing `pull-requests: write`
      # permission (the default for a pull request from a fork) must not turn a
      # passing dependency check into a failed job.
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.token }}
        MARKDOWN_PATH: ${{ steps.markdown.outputs.markdown-path }}
        COMMENT_KEY: ${{ inputs.comment-key }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -uo pipefail

        # The action's own identity marker, first line of the body. Keyed so a
        # matrix or multi-manifest workflow updates one comment per key instead
        # of several runs overwriting each other's single comment.
        marker="<!-- cargo-depcheck:${COMMENT_KEY} -->"
        body="$RUNNER_TEMP/cargo-depcheck-comment.md"
        { echo "$marker"; cat "$MARKDOWN_PATH"; } >"$body"

        existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
          --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" 2>/dev/null | head -1)

        if [ -n "${existing:-}" ]; then
          url=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
            -F "body=@$body" --jq .html_url) || {
              echo "::warning::Could not update the existing cargo-depcheck comment. Does the job have 'pull-requests: write'?"
              exit 0
            }
        else
          url=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -F "body=@$body" --jq .html_url) || {
              echo "::warning::Could not post the cargo-depcheck comment. Does the job have 'pull-requests: write'?"
              exit 0
            }
        fi
        echo "comment-url=$url" >>"$GITHUB_OUTPUT"

    - name: Run cargo-depcheck
      id: run
      shell: bash
      env:
        INPUT_MANIFEST_PATH: ${{ inputs.manifest-path }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_TOP: ${{ inputs.top }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        MARKDOWN_PATH: ${{ steps.markdown.outputs.markdown-path }}
      run: |
        set -uo pipefail

        args=(depcheck --json)
        [ -n "$INPUT_MANIFEST_PATH" ] && args+=(--manifest-path "$INPUT_MANIFEST_PATH")
        [ -n "$INPUT_THRESHOLD" ] && args+=(--threshold "$INPUT_THRESHOLD")
        [ -n "$INPUT_FAIL_ON" ] && args+=(--fail-on "$INPUT_FAIL_ON")
        [ "$INPUT_ALLOW_INCOMPLETE" = "true" ] && args+=(--allow-incomplete)
        [ -n "$INPUT_TOP" ] && args+=(--top "$INPUT_TOP")
        [ -n "$INPUT_BASELINE" ] && args+=(--baseline "$INPUT_BASELINE")
        for crate in $INPUT_IGNORE; do
          args+=(--ignore "$crate")
        done

        report_path="$RUNNER_TEMP/cargo-depcheck-report.json"
        cargo-depcheck "${args[@]}" >"$report_path" 2>"$RUNNER_TEMP/cargo-depcheck-stderr.log"
        code=$?
        cat "$RUNNER_TEMP/cargo-depcheck-stderr.log" >&2

        # jq on an empty or unreadable file exits 0 with empty output (not an
        # error) — a plain `|| fallback` never triggers for that case, so the
        # empty-string check below is load-bearing, not defensive filler.
        extract() {
          local value
          value=$(jq -r ".summary.$1 // \"unknown\"" "$report_path" 2>/dev/null)
          echo "${value:-unknown}"
        }
        critical=$(extract critical)
        warnings=$(extract warnings)
        notices=$(extract notices)
        unknown_count=$(extract unknown)
        not_applicable=$(extract not_applicable)
        ignored=$(extract ignored)
        healthy=$(extract healthy)

        {
          echo "critical=$critical"
          echo "warnings=$warnings"
          echo "notices=$notices"
          echo "unknown=$unknown_count"
          echo "not_applicable=$not_applicable"
          echo "ignored=$ignored"
          echo "healthy=$healthy"
          echo "report-path=$report_path"
        } >>"$GITHUB_OUTPUT"

        if [ "$INPUT_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          # Prefer the real report: the counts table alone says a job found
          # four warnings without saying which crates, which is the first
          # thing anyone reading a job summary wants to know. The table stays
          # as the fallback for when the Markdown step could not run.
          if [ -n "${MARKDOWN_PATH:-}" ] && [ -s "${MARKDOWN_PATH:-}" ]; then
            cat "$MARKDOWN_PATH" >>"$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### cargo-depcheck"
              echo
              echo "| critical | warnings | notices | unknown | not applicable | ignored | healthy |"
              echo "|---|---|---|---|---|---|---|"
              echo "| $critical | $warnings | $notices | $unknown_count | $not_applicable | $ignored | $healthy |"
            } >>"$GITHUB_STEP_SUMMARY"
          fi
        fi

        exit "$code"
